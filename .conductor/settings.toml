#:schema https://conductor.build/schemas/settings.repo.schema.json

[scripts]
# Pre-resolve Swift package dependencies so first builds are fast, and
# install the Sandcastle runner's dependencies (guarded: a machine without
# pnpm still sets up — only the Sandcastle runner needs them).
setup = '''
set -e
git config core.hooksPath .githooks
if command -v swift >/dev/null 2>&1; then
  swift package resolve
fi
if command -v pnpm >/dev/null 2>&1; then
  pnpm -C .sandcastle install
fi
'''
# Remove the entire workspace directory. Also guarantees untracked
# artifacts (swift/.build, dist) never block worktree removal.
archive = 'if [ -n "$CONDUCTOR_WORKSPACE_PATH" ]; then rm -rf "$CONDUCTOR_WORKSPACE_PATH"; fi'
# The app grabs a global hotkey, the microphone, and system audio ducking —
# only one instance can meaningfully run at a time.
run_mode = "nonconcurrent"

[scripts.run.swift-app]
command = "swift run -c release"
default = true
icon = "mic"

[scripts.run.swift-build]
command = "swift build"
icon = "hammer"

# Launch the Sandcastle sequential-reviewer loop. An interactive terminal
# picker selects one model and effort for both the implement and review phase.
# Agents run in place on the current Conductor workspace branch. Local-only:
# the app cannot build in a Linux container, and the runner needs the host's
# `claude` or `codex` login plus `gh`. Uses the tsx vendored in .sandcastle/ —
# there is no hoisted root node_modules, and `npx` would download from the registry
# at run time. Sandcastle requires cwd = repo root (the default) for git and
# prompt-file resolution.
[scripts.run.sandcastle]
command = ".sandcastle/node_modules/.bin/tsx .sandcastle/main.mts"
available_in = "local"
icon = "castle"
