name: release-validation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sparkle-bundle:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(
            github.head_ref,
            'release-please--branches--main--components--'
          )
        )
      }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture Swift toolchain version
        id: swift
        run: echo "hash=$(swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-bundle-${{ runner.os }}-${{ steps.swift.outputs.hash }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-bundle-${{ runner.os }}-${{ steps.swift.outputs.hash }}-
      - name: Build updater-enabled and development bundles
        run: |
          python3 scripts/build_swift_app.py --bundle-only
          python3 scripts/build_swift_app.py --development-bundle-only
      - name: Verify Sparkle bundle contract
        env:
          RUN_SPARKLE_BUNDLE_TESTS: "1"
        run: swift test --filter SparkleBundleTests

  update-runtime-acceptance:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(
            github.head_ref,
            'release-please--branches--main--components--'
          )
        )
      }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Capture Swift toolchain version
        id: swift
        run: echo "hash=$(swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-update-runtime-${{ runner.os }}-${{ steps.swift.outputs.hash }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-update-runtime-${{ runner.os }}-${{ steps.swift.outputs.hash }}-
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE:?MACOS_CERTIFICATE secret is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD secret is required}"
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/foldwise-update-acceptance.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/foldwise-developer-id.p12"
          trap 'rm -f "$CERTIFICATE_PATH"' EXIT

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Prove signed update replacement and relaunch
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          : "${CODESIGN_IDENTITY:?CODESIGN_IDENTITY secret is required}"
          python3 scripts/update_runtime_acceptance.py \
            --artifacts dist/update-runtime-acceptance
      - name: Preserve runtime diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: update-runtime-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/update-runtime-acceptance/
          if-no-files-found: error
          retention-days: 30

  pane-performance:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(
            github.head_ref,
            'release-please--branches--main--components--'
          )
        )
      }}
    runs-on: [self-hosted, macOS, ARM64, foldwise-pane-reference]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run fixed-Mac pane release gate
        run: >-
          python3 scripts/run_pane_performance.py
          --output-directory
          "$RUNNER_TEMP/pane-performance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Verify the retained report through XCTest
        env:
          FOLDWISE_PANE_PERFORMANCE_REPORT: >-
            ${{ runner.temp }}/pane-performance-${{ github.run_id }}-${{ github.run_attempt }}/pane-performance-report.json
          FOLDWISE_PANE_PERFORMANCE_BASELINES: >-
            ${{ github.workspace }}/docs/pane-performance-baselines.json
        run: >-
          swift test -c release
          --filter PanePerformanceReleaseGateTests/testFixedMacReportMeetsRelativeAndAbsoluteBaselines
      - name: Preserve pane evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pane-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pane-performance-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
