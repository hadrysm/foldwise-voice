name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build the .dmg and attach it to the release the job above just created.
  # Must be chained here (not an `on: release` workflow): releases created
  # with the default GITHUB_TOKEN don't trigger other workflows.
  #
  # Release artifacts are always Developer ID signed and notarized. Configure:
  #   MACOS_CERTIFICATE          base64 of the Developer ID Application .p12
  #                              (base64 -i cert.p12 | pbcopy)
  #   MACOS_CERTIFICATE_PASSWORD password of that .p12
  #   CODESIGN_IDENTITY          "Developer ID Application: Name (TEAMID)"
  #   NOTARY_API_PRIVATE_KEY_BASE64
  #                              base64 of a Team App Store Connect API .p8 key
  #   NOTARY_API_KEY_ID          App Store Connect API key ID
  #   NOTARY_API_ISSUER_ID       App Store Connect API issuer ID
  upload-dmg:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE:?MACOS_CERTIFICATE secret is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD secret is required}"
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/foldwise-build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/foldwise-developer-id.p12"
          trap 'rm -f "$CERTIFICATE_PATH"' EXIT

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Build .dmg
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          : "${CODESIGN_IDENTITY:?CODESIGN_IDENTITY secret is required}"
          python3 scripts/build_swift_app.py --dmg
      - name: Notarize and staple
        env:
          NOTARY_API_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_API_PRIVATE_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${NOTARY_API_PRIVATE_KEY_BASE64:?NOTARY_API_PRIVATE_KEY_BASE64 secret is required}"
          : "${NOTARY_API_KEY_ID:?NOTARY_API_KEY_ID secret is required}"
          : "${NOTARY_API_ISSUER_ID:?NOTARY_API_ISSUER_ID secret is required}"
          NOTARY_KEY_PATH="$RUNNER_TEMP/foldwise-notary-key.p8"
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          umask 077
          printf '%s' "$NOTARY_API_PRIVATE_KEY_BASE64" \
            | base64 --decode > "$NOTARY_KEY_PATH"

          xcrun notarytool submit dist/FoldWise-Voice-*.dmg \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_API_KEY_ID" \
            --issuer "$NOTARY_API_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/FoldWise-Voice-*.dmg
      - name: Verify release artifact
        run: |
          set -euo pipefail
          APP_PATH="dist/dmg/FoldWise Voice.app"
          DMG_PATH=(dist/FoldWise-Voice-*.dmg)

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "${DMG_PATH[0]}"
          codesign -dvvv "$APP_PATH"
          codesign -dr - "$APP_PATH"
          spctl -a -vvv -t exec "$APP_PATH"
          spctl -a -vvv -t open \
            --context context:primary-signature "${DMG_PATH[0]}"
          xcrun stapler validate "${DMG_PATH[0]}"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/FoldWise-Voice-*.dmg
