name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID that submitted the preserved DMG
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

# A normal release and a recovery finalizer must never race each other. Apple
# continues processing timed-out submissions, so queued runs are not canceled.
concurrency:
  group: foldwise-release-notarization
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and submit exactly once. The draft release and forced tag already
  # exist, but no public release asset is attached in this stage.
  submit-notarization:
    needs: release-please
    if: >-
      ${{
        github.event_name == 'push' &&
        needs.release-please.outputs.release_created == 'true'
      }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE:?MACOS_CERTIFICATE secret is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD secret is required}"
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/foldwise-build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/foldwise-developer-id.p12"
          trap 'rm -f "$CERTIFICATE_PATH"' EXIT

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Build signed DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          : "${CODESIGN_IDENTITY:?CODESIGN_IDENTITY secret is required}"
          python3 scripts/build_swift_app.py --dmg
          mkdir -p dist/notarization
          DMG_PATH=(dist/FoldWise-Voice-*.dmg)
          mv "${DMG_PATH[0]}" dist/notarization/
      - name: Submit without waiting
        env:
          NOTARY_API_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_API_PRIVATE_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          : "${NOTARY_API_PRIVATE_KEY_BASE64:?NOTARY_API_PRIVATE_KEY_BASE64 secret is required}"
          : "${NOTARY_API_KEY_ID:?NOTARY_API_KEY_ID secret is required}"
          : "${NOTARY_API_ISSUER_ID:?NOTARY_API_ISSUER_ID secret is required}"
          NOTARY_KEY_PATH="$RUNNER_TEMP/foldwise-notary-key.p8"
          export NOTARY_KEY_PATH
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          umask 077
          printf '%s' "$NOTARY_API_PRIVATE_KEY_BASE64" \
            | base64 --decode > "$NOTARY_KEY_PATH"

          DMG_PATH=(dist/notarization/FoldWise-Voice-*.dmg)
          python3 scripts/release_notarization.py submit \
            --dmg "${DMG_PATH[0]}" \
            --record dist/notarization/submission.json \
            --tag "$RELEASE_TAG" \
            --source-run-id "$GITHUB_RUN_ID" \
            --commit "$(git rev-parse HEAD)"
      - name: Preserve submission recovery state
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ github.run_id }}
          path: dist/notarization/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # The same job handles the first finalization and every later recovery. A
  # manual dispatch names only the source run; its immutable artifact carries
  # the tag, filename, checksum, commit, and Apple submission UUID.
  finalize-notarization:
    needs: [release-please, submit-notarization]
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'push' &&
            needs.submit-notarization.result == 'success'
          )
        )
      }}
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      SOURCE_RUN_ID: >-
        ${{
          github.event_name == 'workflow_dispatch' &&
          inputs.source_run_id ||
          github.run_id
        }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download preserved submission
        uses: actions/download-artifact@v4
        with:
          name: notarization-${{ env.SOURCE_RUN_ID }}
          path: dist/notarization
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Restore the release source and publication tools
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(jq -r '.commit' dist/notarization/submission.json)
          git checkout --detach "$RELEASE_COMMIT"
          swift package resolve
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi
          test -x .build/artifacts/sparkle/Sparkle/bin/generate_appcast
      - name: Wait, staple, verify, and publish authenticated update
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          GH_TOKEN: ${{ github.token }}
          NOTARY_API_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_API_PRIVATE_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          UPDATE_R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          UPDATE_R2_BUCKET: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          : "${NOTARY_API_PRIVATE_KEY_BASE64:?NOTARY_API_PRIVATE_KEY_BASE64 secret is required}"
          : "${NOTARY_API_KEY_ID:?NOTARY_API_KEY_ID secret is required}"
          : "${NOTARY_API_ISSUER_ID:?NOTARY_API_ISSUER_ID secret is required}"
          NOTARY_KEY_PATH="$RUNNER_TEMP/foldwise-notary-key.p8"
          export NOTARY_KEY_PATH
          trap 'rm -f "$NOTARY_KEY_PATH"' EXIT
          umask 077
          printf '%s' "$NOTARY_API_PRIVATE_KEY_BASE64" \
            | base64 --decode > "$NOTARY_KEY_PATH"

          python3 scripts/release_notarization.py finalize \
            --artifact-directory dist/notarization \
            --record dist/notarization/submission.json \
            --log dist/notarization/notarization-log.json \
            --repository "$GITHUB_REPOSITORY"
      - name: Preserve failed finalizer evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: >-
            notarization-finalizer-${{ env.SOURCE_RUN_ID }}-${{
            github.run_id }}-${{ github.run_attempt }}
          path: dist/notarization/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
