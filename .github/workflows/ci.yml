name: ci

on:
  pull_request:
  # Also run on main so the SPM cache stays warm for PRs (caches created on
  # PR branches are not shared with sibling PRs; caches from main are).
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Both tools are preinstalled on the GitHub macOS images; brew is a
      # self-healing fallback in case an image update drops them.
      - name: Install tools if missing
        run: |
          which swiftlint  || brew install swiftlint
          which swiftformat || brew install swiftformat
      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The coverage policy compares included production lines with the
          # target branch, so the merge base must be available locally.
          fetch-depth: 0
      # Compiled .swiftmodule artifacts in .build are toolchain-specific: a
      # module built by one Swift version cannot be imported by another. The
      # cache key must include the compiler version so a runner-image toolchain
      # bump invalidates it instead of restoring incompatible modules.
      - name: Capture Swift toolchain version
        id: swift
        run: echo "hash=$(swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ steps.swift.outputs.hash }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.swift.outputs.hash }}-
      - name: Test release automation
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Test and enforce coverage policy
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: ./scripts/coverage.sh

  sparkle-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture Swift toolchain version
        id: swift
        run: echo "hash=$(swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-bundle-${{ runner.os }}-${{ steps.swift.outputs.hash }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-bundle-${{ runner.os }}-${{ steps.swift.outputs.hash }}-
      - name: Build updater-enabled and development bundles
        run: |
          python3 scripts/build_swift_app.py --bundle-only
          python3 scripts/build_swift_app.py --development-bundle-only
      - name: Verify Sparkle bundle contract
        env:
          RUN_SPARKLE_BUNDLE_TESTS: "1"
        run: swift test --filter SparkleBundleTests

  update-runtime-acceptance:
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Capture Swift toolchain version
        id: swift
        run: echo "hash=$(swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-update-runtime-${{ runner.os }}-${{ steps.swift.outputs.hash }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-update-runtime-${{ runner.os }}-${{ steps.swift.outputs.hash }}-
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE:?MACOS_CERTIFICATE secret is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD secret is required}"
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/foldwise-update-acceptance.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/foldwise-developer-id.p12"
          trap 'rm -f "$CERTIFICATE_PATH"' EXIT

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Prove signed update replacement and relaunch
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          : "${CODESIGN_IDENTITY:?CODESIGN_IDENTITY secret is required}"
          python3 scripts/update_runtime_acceptance.py \
            --artifacts dist/update-runtime-acceptance
      - name: Preserve runtime diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: update-runtime-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/update-runtime-acceptance/
          if-no-files-found: error
          retention-days: 30
