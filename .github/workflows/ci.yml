name: ci

on:
  pull_request:
  # Also run on main so the SPM cache stays warm for PRs (caches created on
  # PR branches are not shared with sibling PRs; caches from main are).
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: macos-latest
    # Normally ~30s; the ceiling only has to cover the brew fallback below.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Both tools are preinstalled on the GitHub macOS images; brew is a
      # self-healing fallback in case an image update drops them.
      - name: Install tools if missing
        run: |
          which swiftlint  || brew install swiftlint
          which swiftformat || brew install swiftformat
      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    runs-on: macos-latest
    # The XCTest deadlock in #408 parks the suite on an expectation that never
    # fulfils, so a hung run would otherwise sit on GitHub's 360-minute default
    # before being killed — six hours of a required check stuck yellow. A warm
    # run takes 2-4 minutes; the ceiling is sized for a cold cache after a
    # toolchain bump invalidates the key above, and turns a deadlock into a
    # prompt red failure instead of an all-afternoon stall.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # The coverage policy compares included production lines with the
          # target branch, so the merge base must be available locally.
          fetch-depth: 0
      # Compiled .swiftmodule artifacts in .build are toolchain-specific: a
      # module built by one Swift version cannot be imported by another. The
      # cache key must include the compiler version so a runner-image toolchain
      # bump invalidates it instead of restoring incompatible modules.
      - name: Capture Swift toolchain version
        id: swift
        run: echo "hash=$(swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ steps.swift.outputs.hash }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ steps.swift.outputs.hash }}-
      - name: Test release automation
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Test and enforce coverage policy
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: ./scripts/coverage.sh
